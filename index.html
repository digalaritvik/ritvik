<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Runner Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Orbitron', sans-serif;
            color: #e94560;
            overflow: hidden;
        }

        #game-container {
            background: rgba(42, 42, 66, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.2),
                        inset 0 0 20px rgba(233, 69, 96, 0.1);
            backdrop-filter: blur(10px);
            transform: perspective(1000px) rotateX(5deg);
            transition: transform 0.3s ease;
        }

        #game-container:hover {
            transform: perspective(1000px) rotateX(0deg);
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            letter-spacing: 3px;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #e94560, transparent);
        }

        #maze {
            display: grid;
            grid-template-columns: repeat(20, 30px);
            gap: 2px;
            background: rgba(51, 51, 77, 0.5);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }

        .cell {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            position: relative;
        }

        .wall {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
            transform-style: preserve-3d;
            transform: translateZ(5px);
        }

        .wall::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%);
            border-radius: 5px;
        }

        .path {
            background: rgba(42, 42, 66, 0.3);
            border-radius: 5px;
            border: 1px solid rgba(233, 69, 96, 0.1);
        }

        .player {
            background: radial-gradient(circle at 30% 30%, #e94560, #533483);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
            animation: pulse 1.5s infinite, glow 2s infinite;
            z-index: 2;
        }

        .enemy {
            background: radial-gradient(circle at 30% 30%, #ff0000, #8b0000);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            animation: enemyPulse 1s infinite;
            z-index: 1;
        }

        @keyframes pulse {
            0% { transform: scale(0.95) translateZ(0); }
            50% { transform: scale(1.05) translateZ(10px); }
            100% { transform: scale(0.95) translateZ(0); }
        }

        @keyframes glow {
            0% { box-shadow: 0 0 20px rgba(233, 69, 96, 0.6); }
            50% { box-shadow: 0 0 30px rgba(233, 69, 96, 0.8), 0 0 50px rgba(233, 69, 96, 0.4); }
            100% { box-shadow: 0 0 20px rgba(233, 69, 96, 0.6); }
        }

        @keyframes enemyPulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.95); }
        }

        .score {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            color: #ff0000;
            font-size: 36px;
            display: none;
            z-index: 100;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }

        .game-over.show {
            display: block;
            animation: gameOverPulse 1s infinite;
        }

        @keyframes gameOverPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .dot {
            background: radial-gradient(circle at 30% 30%, #ffd700, #ffa500);
            border-radius: 50%;
            width: 8px;
            height: 8px;
            margin: auto;
        }

        .power-up {
            background: radial-gradient(circle at 30% 30%, #00ff00, #008000);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
            animation: powerUpPulse 1s infinite;
        }

        @keyframes powerUpPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        #controls {
            margin-top: 30px;
            text-align: center;
            perspective: 1000px;
        }

        #controls p {
            color: #e94560;
            font-size: 1.2em;
            text-shadow: 0 0 5px rgba(233, 69, 96, 0.5);
            margin-bottom: 20px;
        }

        .button {
            background: linear-gradient(45deg, #533483, #e94560);
            border: none;
            color: white;
            padding: 12px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 25px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3);
            position: relative;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.3s ease;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
        }

        .button:hover::before {
            animation: shine 1.5s infinite;
        }

        @keyframes shine {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        #message {
            margin-top: 20px;
            font-size: 24px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #message.show {
            opacity: 1;
            animation: celebrate 1s infinite;
        }

        @keyframes celebrate {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Responsive design */
        @media (max-width: 600px) {
            #maze {
                grid-template-columns: repeat(20, 25px);
            }
            .cell {
                width: 25px;
                height: 25px;
            }
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>MAZE RUNNER</h1>
        <div class="score">Score: <span id="score">0</span></div>
        <div id="maze"></div>
        <div id="controls">
            <p>Use arrow keys or WASD to move</p>
            <button class="button" onclick="resetGame()">Reset Game</button>
        </div>
        <div id="message"></div>
    </div>
    <div id="gameOver" class="game-over">
        GAME OVER!<br>
        Final Score: <span id="finalScore">0</span><br>
        <button class="button" onclick="resetGame()">Play Again</button>
    </div>

    <script>
        const maze = [
            "####################",
            "#........#........#",
            "#.##.###.#.###.##.#",
            "#.##.###.#.###.##.#",
            "#.................#",
            "#.##.#.#####.#.##.#",
            "#....#...#...#....#",
            "####.###.#.###.####",
            "   #.#.......#.#   ",
            "####.#.##-##.#.####",
            "#......#...#......#",
            "#.##.###.#.###.##.#",
            "#.##.#.......#.##.#",
            "#....##.###.##....#",
            "#.##.#.......#.##.#",
            "#.##.###.#.###.##.#",
            "#.................#",
            "####################"
        ];

        let playerX = 1;
        let playerY = 1;
        let enemyX = 17;
        let enemyY = 1;
        let score = 0;
        let dots = [];
        let powerUps = [];
        let gameWon = false;
        let gameOver = false;
        let powerUpActive = false;
        let powerUpTimer = null;

        function createMaze() {
            const mazeElement = document.getElementById('maze');
            mazeElement.innerHTML = '';
            mazeElement.style.gridTemplateColumns = `repeat(${maze[0].length}, 30px)`;

            for (let y = 0; y < maze.length; y++) {
                for (let x = 0; x < maze[y].length; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.width = '30px';
                    cell.style.height = '30px';

                    if (x === playerX && y === playerY) {
                        cell.className += ' player';
                    } else if (x === enemyX && y === enemyY) {
                        cell.className += ' enemy';
                    } else if (maze[y][x] === '#') {
                        cell.className += ' wall';
                    } else if (maze[y][x] === '.') {
                        cell.className += ' path';
                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        cell.appendChild(dot);
                        dots.push({x, y});
                    } else if (maze[y][x] === 'o') {
                        cell.className += ' path';
                        const powerUp = document.createElement('div');
                        powerUp.className = 'power-up';
                        cell.appendChild(powerUp);
                        powerUps.push({x, y});
                    } else {
                        cell.className += ' path';
                    }

                    mazeElement.appendChild(cell);
                }
            }
        }

        function isWall(x, y) {
            return maze[y][x] === '#';
        }

        function moveEnemy() {
            if (gameOver || gameWon) return;

            const directions = [
                {dx: 1, dy: 0},
                {dx: -1, dy: 0},
                {dx: 0, dy: 1},
                {dx: 0, dy: -1}
            ];

            // Simple AI: Move towards player
            let bestMove = null;
            let minDistance = Infinity;

            for (const dir of directions) {
                const newX = enemyX + dir.dx;
                const newY = enemyY + dir.dy;

                if (!isWall(newX, newY)) {
                    const distance = Math.abs(newX - playerX) + Math.abs(newY - playerY);
                    if (distance < minDistance) {
                        minDistance = distance;
                        bestMove = dir;
                    }
                }
            }

            if (bestMove) {
                enemyX += bestMove.dx;
                enemyY += bestMove.dy;
            }

            // Check for collision
            if (enemyX === playerX && enemyY === playerY) {
                if (powerUpActive) {
                    // Enemy is vulnerable
                    enemyX = 17;
                    enemyY = 1;
                    score += 200;
                    updateScore();
                } else {
                    gameOver = true;
                    document.getElementById('gameOver').className = 'game-over show';
                    document.getElementById('finalScore').textContent = score;
                }
            }
        }

        function movePlayer(dx, dy) {
            if (gameOver || gameWon) return;

            const newX = playerX + dx;
            const newY = playerY + dy;

            if (!isWall(newX, newY)) {
                playerX = newX;
                playerY = newY;
                createMaze();

                // Check for dots
                const dotIndex = dots.findIndex(dot => dot.x === playerX && dot.y === playerY);
                if (dotIndex !== -1) {
                    dots.splice(dotIndex, 1);
                    score += 10;
                    updateScore();
                }

                // Check for power-ups
                const powerUpIndex = powerUps.findIndex(pu => pu.x === playerX && pu.y === playerY);
                if (powerUpIndex !== -1) {
                    powerUps.splice(powerUpIndex, 1);
                    score += 50;
                    updateScore();
                    activatePowerUp();
                }

                if (dots.length === 0 && powerUps.length === 0) {
                    gameWon = true;
                    const messageEl = document.getElementById('message');
                    messageEl.textContent = '🎉 Congratulations! You cleared the maze! 🎉';
                    messageEl.className = 'show';
                }
            }
        }

        function activatePowerUp() {
            powerUpActive = true;
            if (powerUpTimer) clearTimeout(powerUpTimer);
            powerUpTimer = setTimeout(() => {
                powerUpActive = false;
            }, 10000); // Power-up lasts 10 seconds
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        function resetGame() {
            playerX = 1;
            playerY = 1;
            enemyX = 17;
            enemyY = 1;
            score = 0;
            gameWon = false;
            gameOver = false;
            powerUpActive = false;
            if (powerUpTimer) clearTimeout(powerUpTimer);
            document.getElementById('gameOver').className = 'game-over';
            const messageEl = document.getElementById('message');
            messageEl.textContent = '';
            messageEl.className = '';
            updateScore();
            createMaze();
        }

        document.addEventListener('keydown', (event) => {
            switch(event.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    movePlayer(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    movePlayer(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    movePlayer(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    movePlayer(1, 0);
                    break;
            }
        });

        // Game loop
        setInterval(moveEnemy, 500); // Enemy moves every 500ms

        // Initialize the game
        createMaze();
    </script>
</body>
</html>
